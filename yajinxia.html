<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盐津虾 AI · 北京时律盐创文化传播工作室</title>

    <link rel="preconnect" href="https://cdn.bootcdn.net">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="BIGlogo.png" type="image/png" sizes="64x64" />
    <style>
        /* ===== 自定义品牌字体：抖音美好体 ===== */
        @font-face {
            font-family: 'DouyinMeihao';
            src: url("抖音美好体.otf") format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        .font-brand { font-family: 'DouyinMeihao', 'Noto Sans SC', sans-serif; }

        /* ===== Liquid Glass Design System ===== */
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-light: #ecfdf5;
            --primary-subtle: #d1fae5;
            --primary-glow: rgba(16, 185, 129, 0.25);

            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-bg-strong: rgba(255, 255, 255, 0.88);
            --glass-bg-light: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-border-subtle: rgba(0, 0, 0, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --glass-blur: saturate(180%) blur(20px);

            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --surface-hover: #f1f5f9;

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --text-on-primary: #ffffff;

            --border: #e2e8f0;
            --border-hover: #cbd5e1;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
            --shadow-xl: 0 24px 48px rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.04);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            --radius-full: 9999px;

            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --liquid-card-bg: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.72) 0%,
                rgba(255, 255, 255, 0.35) 45%,
                rgba(255, 255, 255, 0.12) 100%
            );
            --liquid-nav-bg: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.78) 0%,
                rgba(255, 255, 255, 0.48) 100%
            );
            --liquid-strong-bg: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.82) 0%,
                rgba(255, 255, 255, 0.52) 100%
            );
            --liquid-light-bg: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.58) 0%,
                rgba(255, 255, 255, 0.20) 100%
            );
            --liquid-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.75);
            --liquid-inner-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.04);
            --liquid-edge-glow: 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            --liquid-shadow-colored: 0 8px 32px rgba(16, 185, 129, 0.10),
                                     0 2px 8px rgba(0, 0, 0, 0.04);
            --liquid-blur: saturate(200%) blur(28px);

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 150ms;
            --duration-normal: 300ms;
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(16, 185, 129, 0.07), transparent),
                radial-gradient(ellipse 60% 50% at 80% 50%, rgba(16, 185, 129, 0.04), transparent),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(16, 185, 129, 0.03), transparent),
                var(--surface-alt);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Ambient glow orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
            animation: orb-float 20s ease-in-out infinite;
        }
        .ambient-orb--top {
            width: 600px; height: 600px;
            background: rgba(16, 185, 129, 0.08);
            top: -200px; right: -150px;
        }
        .ambient-orb--bottom {
            width: 500px; height: 500px;
            background: rgba(16, 185, 129, 0.06);
            bottom: -150px; left: -100px;
            animation-delay: -10s;
            animation-duration: 25s;
        }
        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(-30px, -10px) scale(1.02); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
        @media (max-width: 640px) { .container { padding: 0 16px; } }

        /* ===== Header — Liquid Glass ===== */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: var(--liquid-strong-bg);
            backdrop-filter: var(--liquid-blur);
            -webkit-backdrop-filter: var(--liquid-blur);
            border-bottom: 1px solid transparent;
            box-shadow: var(--liquid-inner-highlight);
            transition: all var(--duration-normal) var(--ease-out);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between; height: 76px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { height: 96px; width: auto; min-width: 130px; margin-left: -8px; transition: opacity var(--duration-fast); }
        .logo:hover { opacity: 0.8; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        theme-button#themeToggle { display: block; width: 90px; height: 35px; position: relative; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-secondary); text-decoration: none;
            font-size: 14px; font-weight: 500;
            padding: 8px 16px; border-radius: var(--radius-full);
            background: var(--liquid-light-bg);
            backdrop-filter: var(--liquid-blur);
            -webkit-backdrop-filter: var(--liquid-blur);
            box-shadow: var(--liquid-inner-highlight), var(--liquid-edge-glow);
            transition: all var(--duration-normal) var(--ease-out);
        }
        .back-link:hover { color: var(--primary-hover); transform: translateX(-2px); }

        @media (max-width: 768px) {
            .logo { height: 64px; min-width: 0; margin-left: 0; }
            .back-link span { display: none; }
        }

        /* ===== Hero ===== */
        .hero {
            position: relative; z-index: 1;
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 72px 0 88px; text-align: center;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 60% 80% at 50% 0%, rgba(16,185,129,0.08), transparent),
                radial-gradient(ellipse 40% 50% at 80% 100%, rgba(16,185,129,0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        .hero > * { position: relative; z-index: 1; }
        .hero .container { width: 100%; }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--liquid-light-bg);
            backdrop-filter: var(--liquid-blur);
            -webkit-backdrop-filter: var(--liquid-blur);
            border: none;
            color: var(--primary-hover);
            font-size: 13px; font-weight: 500;
            padding: 6px 18px; border-radius: var(--radius-full);
            margin-bottom: 28px;
            box-shadow: var(--liquid-inner-highlight),
                        var(--liquid-edge-glow),
                        0 4px 16px rgba(16,185,129,0.10);
        }
        .hero-badge::before {
            content: ''; width: 8px; height: 8px;
            background: var(--primary); border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.4); }
        }

        .hero h1 {
            font-size: clamp(3.2rem, 9vw, 5.6rem);
            font-weight: 800; letter-spacing: -0.04em;
            color: var(--text-primary); line-height: 1.08;
            margin-bottom: 16px;
        }
        .hero h1 .accent {
            background: linear-gradient(135deg, var(--primary), #34d399, #6ee7b7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1.05rem, 2vw, 1.2rem);
            color: var(--text-secondary);
            max-width: 560px; margin: 0 auto 44px; line-height: 1.7;
        }

        /* ===== Option Cards ===== */
        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            max-width: 720px;
            margin: 0 auto;
        }
        @media (max-width: 640px) {
            .options { grid-template-columns: 1fr; max-width: 420px; }
        }

        .option-card {
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; text-align: center; text-decoration: none;
            padding: 32px 24px;
            border-radius: var(--radius-xl);
            background: var(--liquid-card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--liquid-inner-highlight),
                        var(--liquid-edge-glow),
                        var(--liquid-shadow-colored);
            transition: all var(--duration-normal) var(--ease-out);
            cursor: pointer;
        }
        .option-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 40%, transparent 70%);
            pointer-events: none;
        }
        .option-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--liquid-inner-highlight),
                        var(--liquid-edge-glow),
                        0 16px 48px rgba(16, 185, 129, 0.18);
        }
        .option-card:active { transform: translateY(-1px) scale(0.99); }

        .option-icon {
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--primary), #34d399);
            color: var(--text-on-primary);
            font-size: 26px;
            margin-bottom: 10px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.25),
                        0 4px 16px rgba(16,185,129,0.3);
        }
        .option-card h2 {
            font-size: 1.25rem; font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .option-card p {
            font-size: 0.9rem; color: var(--text-secondary);
            margin: 0; max-width: none;
        }
        .option-card .arrow {
            margin-top: 14px;
            font-size: 13px; font-weight: 600;
            color: var(--primary-hover);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .option-card .arrow i { transition: transform var(--duration-normal) var(--ease-out); }
        .option-card:hover .arrow i { transform: translateX(4px); }

        /* ===== Footer ===== */
        .footer {
            position: relative; z-index: 1;
            background: var(--glass-bg-light);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border-subtle);
            padding: 28px 0; margin-top: auto;
        }
        .footer-inner { text-align: center; }
        .footer-brand {
            font-size: 13px; color: var(--text-secondary);
            line-height: 1.8; margin-bottom: 10px;
        }
        .footer-copy { font-size: 12px; color: var(--text-tertiary); }

        /* ===== Animations ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeUp 0.6s var(--ease-out) both; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }

        /* ===== Dark Theme ===== */
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="dark"] {
            --primary: #34d399;
            --primary-hover: #6ee7b7;
            --primary-light: #042f2e;
            --primary-subtle: #064e3b;
            --primary-glow: rgba(52, 211, 153, 0.25);

            --glass-bg: rgba(15, 23, 42, 0.72);
            --glass-bg-strong: rgba(15, 23, 42, 0.88);
            --glass-bg-light: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-subtle: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);

            --surface: #0f172a;
            --surface-alt: #0b1120;
            --surface-hover: #1e293b;

            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --text-on-primary: #0f172a;

            --border: #1e293b;
            --border-hover: #334155;

            --liquid-card-bg: linear-gradient(135deg, rgba(30,41,59,0.7) 0%, rgba(15,23,42,0.35) 45%, rgba(15,23,42,0.12) 100%);
            --liquid-nav-bg: linear-gradient(180deg, rgba(15,23,42,0.78) 0%, rgba(15,23,42,0.5) 100%);
            --liquid-strong-bg: linear-gradient(180deg, rgba(15,23,42,0.84) 0%, rgba(15,23,42,0.55) 100%);
            --liquid-light-bg: linear-gradient(135deg, rgba(30,41,59,0.55) 0%, rgba(15,23,42,0.2) 100%);
            --liquid-inner-highlight: inset 0 1px 0 rgba(255,255,255,0.08);
            --liquid-inner-shadow: inset 0 -1px 0 rgba(0,0,0,0.35);
            --liquid-edge-glow: 0 0 0 1px rgba(255,255,255,0.06) inset;
            --liquid-shadow-colored: 0 8px 32px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
            --liquid-blur: saturate(180%) blur(28px);
        }
        html[data-theme="dark"] body {
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(52, 211, 153, 0.06), transparent),
                radial-gradient(ellipse 60% 50% at 80% 50%, rgba(52, 211, 153, 0.04), transparent),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(52, 211, 153, 0.03), transparent),
                var(--surface-alt);
        }
        html[data-theme="dark"] .logo { filter: invert(1); }
        html[data-theme="dark"] .option-card::before {
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 40%, transparent 70%);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%; bottom: 40px;
            transform: translate(-50%, 20px);
            z-index: 999;
            max-width: 90vw;
            padding: 12px 22px;
            border-radius: var(--radius-full);
            background: var(--glass-bg-strong);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            color: var(--text-primary);
            font-size: 14px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 8px;
            opacity: 0; pointer-events: none;
            transition: opacity var(--duration-normal) var(--ease-out),
                        transform var(--duration-normal) var(--ease-out);
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast i { color: var(--primary); }
    </style>
</head>
<body>
    <!-- Ambient glow orbs -->
    <div class="ambient-orb ambient-orb--top"></div>
    <div class="ambient-orb ambient-orb--bottom"></div>

    <!-- ===== Header ===== -->
    <header class="header" id="header">
        <div class="container header-inner">
            <div class="header-left">
                <a href="index.html" class="logo-link" aria-label="回到首页">
                    <img src="logos.png" alt="时律盐创" class="logo">
                </a>
            </div>
            <div class="header-actions">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> <span>返回首页</span>
                </a>
                <theme-button id="themeToggle" value="light" size="1.5"></theme-button>
            </div>
        </div>
    </header>

    <!-- ===== Hero ===== -->
    <section class="hero">
        <div class="container">
            <div class="hero-badge animate-in">时律盐创出品</div>
            <h1 class="animate-in delay-100 font-brand">盐津<span class="accent">虾</span></h1>
            <p class="animate-in delay-200">最懂你的写作搭档 · 实践出真知<br>请选择你的使用设备开始体验</p>
            <div class="options animate-in delay-300">
                <a href="alpha0.2.0/index.html" class="option-card">
                    <div class="option-icon"><i class="fas fa-mobile-screen-button"></i></div>
                    <h2>手机端</h2>
                    <p>移动设备访问，随时随地使用</p>
                    <span class="arrow">立即体验 <i class="fas fa-arrow-right"></i></span>
                </a>
                <!-- 电脑端：点击直接开始下载（下载地址在页面底部脚本的 DESKTOP_DOWNLOAD_URL 中填写） -->
                <a href="#" id="desktopDownload" class="option-card">
                    <div class="option-icon"><i class="fas fa-desktop"></i></div>
                    <h2>电脑端</h2>
                    <p>下载桌面版本，DeepSeek模型性能更强劲</p>
                    <span class="arrow">立即下载 <i class="fas fa-download"></i></span>
                </a>
            </div>
        </div>
    </section>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <div class="container footer-inner">
            <p class="footer-brand">
                本网站由北京时律盐创文化传播工作室维护与更新<br>
                由北京幻象影业集团运营
            </p>
            <p class="footer-copy">&copy; 2024&ndash;2026 ClockSalt Studio. All rights reserved.</p>
        </div>
    </footer>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ===== 电脑端直接下载 ===== -->
    <script>
    // 电脑端安装包：放到本目录的 download/ 文件夹，改成实际文件名即可（同源直链，点击直接下载，不跳转）
    var DESKTOP_DOWNLOAD_URL = "download/盐津虾AI Setup 1.0.0.exe";
    (function () {
        var toast = document.getElementById('toast');
        var timer = null;
        function showToast(msg) {
            if (!toast) return;
            toast.innerHTML = '<i class="fas fa-circle-info"></i>' + msg;
            toast.classList.add('show');
            clearTimeout(timer);
            timer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
        }
        var btn = document.getElementById('desktopDownload');
        if (!btn) return;
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            if (!DESKTOP_DOWNLOAD_URL) {
                showToast('电脑端下载即将上线，敬请期待');
                return;
            }
            var a = document.createElement('a');
            a.href = DESKTOP_DOWNLOAD_URL;
            a.setAttribute('download', '');
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('已开始下载，请留意浏览器下载栏');
        });
    })();
    </script>

    <!-- ===== 白天黑夜切换（跟随系统） ===== -->
    <script>
    (function () {
        var saved = null;
        try { saved = localStorage.getItem('site-theme'); } catch (e) {}
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var init = saved || (sysDark ? 'dark' : 'light');
        var btn = document.getElementById('themeToggle');
        if (btn) btn.setAttribute('value', init);
        document.documentElement.setAttribute('data-theme', init);
        if (btn) {
            btn.addEventListener('change', function (e) {
                var theme = e.detail === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('site-theme', theme); } catch (err) {}
            });
        }
    })();
    </script>
    <script src="白天黑夜切换按钮4.0/js/script.js"></script>

</body>
</html>
