<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f8f4">
<title>盐津虾 AI · 实践出真知</title>
<style>
:root{
  --primary:#10A968;
  --primary-hover:#0B8F59;
  --accent:#35D58C;
  --text-0:#16211b;
  --text-1:#5f7167;
  --text-2:#93a89b;
  --border:#dfe9e2;
  --card:#ffffff;
  --radius:20px;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text-0);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(53,213,140,.14), transparent 60%),
    radial-gradient(900px 600px at -10% 100%, rgba(16,169,104,.10), transparent 55%),
    linear-gradient(180deg,#f4faf6 0%,#eef6f1 55%,#f7fbf8 100%);
  min-height:100vh;overflow-x:hidden;
}

/* ---- 顶部导航 ---- */
.nav{
  position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,5vw,64px);
  animation:fade-down .7s var(--ease-out) both;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-0)}
.brand-mark{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#10A968,#3EDC94);color:#fff;
  font-size:18px;font-weight:800;font-family:"STKaiti","KaiTi",serif;
  box-shadow:0 6px 16px -4px rgba(15,169,104,.45);
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:.5px}
.brand-name em{font-style:normal;color:var(--primary)}
.nav-links{display:flex;align-items:center;gap:10px}
.nav-link{
  font-size:13px;color:var(--text-1);text-decoration:none;padding:8px 14px;border-radius:999px;
  transition:color .25s,background .25s;
}
.nav-link:hover{color:var(--primary);background:rgba(16,169,104,.08)}

/* ---- 主体布局 ---- */
.hero{
  position:relative;z-index:5;max-width:1180px;margin:0 auto;
  min-height:calc(100vh - 78px);align-content:center;
  padding:24px clamp(20px,5vw,64px) 90px;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:clamp(28px,4vw,56px);align-items:center;
}

/* 左列 */
.hero-left{min-width:0}
.news{
  display:inline-flex;align-items:flex-start;gap:8px;max-width:100%;
  font-size:13px;line-height:1.7;color:var(--text-1);
  animation:fade-up .7s .05s var(--ease-out) both;
}
.news .dot{color:var(--primary);flex:none;margin-top:2px}
.news a{color:var(--primary);text-decoration:none;white-space:nowrap}
.news a:hover{text-decoration:underline}
/* 大标题：指针悬停出现深色透镜圆，圆内文字反白（DeepSeek 官网同款） */
.title{
  position:relative;display:inline-block;margin-top:22px;
  font-size:clamp(44px,6.4vw,76px);font-weight:800;
  letter-spacing:.14em;line-height:1.15;color:var(--text-0);cursor:text;
  --mx:-200px;--my:-200px;
  animation:fade-up .7s .15s var(--ease-out) both;
}
.lens{
  position:absolute;left:var(--mx);top:var(--my);z-index:3;
  display:none;
  width:72px;height:72px;border-radius:50%;overflow:hidden;
  transform:translate(-50%,-50%) scale(0);
  pointer-events:none;
  background:#221e1a;
  opacity:0;
  transition:transform .38s cubic-bezier(.34,1.35,.64,1),opacity .22s;
}
.title.lens-on .lens{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}
.lens-text{
  position:absolute;white-space:nowrap;color:#e6e9f2;
  left:calc(36px - var(--mx));top:calc(36px - var(--my));
}
@media (hover:none),(pointer:coarse){
  .title{cursor:auto}
}
.cards{
  margin-top:clamp(30px,4vh,46px);display:grid;grid-template-columns:1fr 1fr;gap:16px;
  max-width:560px;animation:fade-up .7s .25s var(--ease-out) both;
}
.card{
  display:block;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 22px 20px;text-decoration:none;color:inherit;
  transition:transform .35s var(--ease-out),box-shadow .35s,border-color .35s;
}
.card:hover{
  border-color:rgba(16,169,104,.55);
  box-shadow:0 0 0 1px rgba(16,169,104,.35);
}
.card h3{font-size:16px;font-weight:700;color:var(--primary)}
.card p{margin-top:8px;font-size:13px;line-height:1.7;color:var(--text-1)}

/* 右列：加入我们大卡 */
.join-card{
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:clamp(280px,38vh,380px);border-radius:26px;overflow:hidden;
  background:linear-gradient(150deg,#0e5c3c 0%,#0a3f2a 55%,#072b1e 100%);
  color:#eafaf1;text-decoration:none;padding:30px;
  box-shadow:0 30px 60px -24px rgba(7,43,30,.55);
  transition:transform .35s var(--ease-out),box-shadow .35s;
  animation:fade-up .7s .3s var(--ease-out) both;
}
.join-card:hover{
  box-shadow:0 30px 60px -24px rgba(7,43,30,.55),0 0 0 2px rgba(53,213,140,.5);
}
.join-card::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(420px 300px at 80% 15%, rgba(53,213,140,.28), transparent 60%),
    radial-gradient(300px 240px at 10% 90%, rgba(16,169,104,.22), transparent 60%);
}
.join-art{
  position:absolute;right:-24px;top:-34px;font-size:220px;line-height:1;
  font-family:"STKaiti","KaiTi",serif;font-weight:800;color:rgba(255,255,255,.07);
  transform:rotate(12deg);user-select:none;pointer-events:none;
}
.join-inner{position:relative;z-index:2}
.join-kicker{font-size:15px;font-weight:600;letter-spacing:1px;color:#bfeed6}
.join-title{margin-top:6px;font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:.12em;color:#fff}
.join-link{margin-top:18px;font-size:13px;color:#9fdcbb;display:inline-flex;align-items:center;gap:6px}
.join-link .arrow{transition:transform .3s var(--ease-out)}
.join-card:hover .join-link .arrow{transform:translateX(4px)}

/* 页脚：固定底部 */
.foot{
  position:fixed;left:0;right:0;bottom:18px;z-index:5;text-align:center;
  padding:0 20px;font-size:11.5px;color:var(--text-2);letter-spacing:1px;
  animation:fade-up .7s .4s var(--ease-out) both;
}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);
  background:rgba(18,26,22,.92);color:#f3f7f5;font-size:13px;padding:11px 22px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .35s var(--ease-out);z-index:10000;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.35);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fade-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-down{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

/* 响应式：窄屏单列 */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .join-card{min-height:230px}
}
@media (max-width:520px){
  .cards{grid-template-columns:1fr}
  .title{letter-spacing:.08em}
}
</style>
</head>
<body>

<main class="hero">
  <!-- 左列：公告 + 大标题 + 双卡片 -->
  <section class="hero-left">
    <div class="news">
      <span class="dot">✦</span>

<script>
/* ---- 大标题黑色透镜：指针移到「实践出真知」上才出现，圆内文字反白 ---- */
(function(){
  var title = document.getElementById('title');
  if(!title) return;
  if(!window.matchMedia('(pointer:fine)').matches) return;
  var lens = title.querySelector('.lens');
  var tx = -200, ty = -200, cx = -200, cy = -200, active = false;
  function tick(){
    cx += (tx - cx) * .28; cy += (ty - cy) * .28;
    title.style.setProperty('--mx', cx + 'px');
    title.style.setProperty('--my', cy + 'px');
    if(active || Math.abs(tx - cx) > .5 || Math.abs(ty - cy) > .5) requestAnimationFrame(tick);
  }
  title.addEventListener('mouseenter', function(e){
    var r = title.getBoundingClientRect();
    tx = cx = e.clientX - r.left; ty = cy = e.clientY - r.top;
    title.style.setProperty('--mx', cx + 'px');
    title.style.setProperty('--my', cy + 'px');
    lens.style.display = 'block';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ title.classList.add('lens-on'); });
    });
    active = true;
    tick();
  });
  title.addEventListener('mousemove', function(e){
    var r = title.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
  });
  title.addEventListener('mouseleave', function(){
    title.classList.remove('lens-on');
    active = false;
  });
  /* 退出动画播完后物理移除，杜绝渲染残渣 */
  lens.addEventListener('transitionend', function(e){
    if(e.propertyName === 'transform' && !title.classList.contains('lens-on')){
      lens.style.display = 'none';
    }
  });
})();

/* ---- 提示条 ---- */
var toastEl = document.getElementById('toast'), toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
}
</script>
